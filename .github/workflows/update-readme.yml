name: Update Contributions

on:
  schedule:
    # Runs daily at 19:00 UTC (04:00 KST)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build and update README contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:readme

      - name: Commit and push changes
        run: |
          if [ -n "$(git status --porcelain README.md data/cache.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md data/cache.json
            git commit -m "chore: update contributions [skip ci]"
            git push
          else
            echo "No contribution changes detected. Working tree clean."
          fi
